<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Nafay AI | Your Intelligent Assistant</title>
		<style>
			:root {
  --primary-color: #176BFA;
  --primary-hover: #0952D4;
  --light-bg: #081426;
  --border-color: #294366;
  --text-color: #F5F9FF;
  --text-light: #B8CCE9;
  --user-msg-bg: #164FAA;
  --assistant-msg-bg: #142742;
}

			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			body {
				font-family:
					-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
					Cantarell, sans-serif;
				line-height: 1.6;
				color: var(--text-color);
				max-width: 800px;
				margin: 0 auto;
				padding: 1rem;
			}

			header {
				text-align: center;
				margin-bottom: 2rem;
				padding: 1rem 0;
				border-bottom: 1px solid var(--border-color);
			}

			h1 {
				font-size: 1.5rem;
				color: var(--primary-color);
			}

			.chat-container {
				display: flex;
				flex-direction: column;
				height: calc(100vh - 200px);
				min-height: 400px;
				border: 1px solid var(--border-color);
				border-radius: 8px;
				overflow: hidden;
			}

			.chat-messages {
				flex: 1;
				overflow-y: auto;
				padding: 1rem;
				background-color: var(--light-bg);
			}

			.message {
				margin-bottom: 1rem;
				padding: 0.75rem;
				border-radius: 8px;
				max-width: 80%;
			}

			.message p {
				white-space: pre-line;
				margin: 0;
				overflow-wrap: anywhere;
			}

			.user-message {
				background-color: var(--user-msg-bg);
				align-self: flex-end;
				margin-left: auto;
			}

			.assistant-message {
				background-color: var(--assistant-msg-bg);
				align-self: flex-start;
			}

			.message-input {
				display: flex;
				padding: 0.75rem;
				border-top: 1px solid var(--border-color);
				background-color: white;
			}

			#user-input {
				flex: 1;
				padding: 0.75rem;
				border: 1px solid var(--border-color);
				border-radius: 4px;
				font-family: inherit;
				resize: none;
				min-height: 44px;
			}

			#send-button {
				margin-left: 0.5rem;
				padding: 0 1rem;
				background-color: var(--primary-color);
				color: white;
				border: none;
				border-radius: 4px;
				cursor: pointer;
				transition: background-color 0.2s;
			}

			#send-button:hover {
				background-color: var(--primary-hover);
			}

			#send-button:disabled {
				background-color: var(--text-light);
				cursor: not-allowed;
			}

			.typing-indicator {
				display: none;
				font-style: italic;
				color: var(--text-light);
				padding: 1rem;
			}

			.typing-indicator.visible {
				display: block;
			}

			footer {
				margin-top: 1rem;
				text-align: center;
				font-size: 0.85rem;
				color: var(--text-light);
			}
		
/* Nafay AI Plus Menu */
.attach-wrapper {
  position: relative;
  flex-shrink: 0;
}

#plusBtn {
  width: 44px;
  height: 44px;
  background: #176BFA;
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 28px;
  cursor: pointer;
}

#plusBtn:hover {
  background: #0952D4;
}

#attachMenu {
  position: absolute;
  bottom: 54px;
  left: 0;
  width: 190px;
  background: #142742;
  border: 1px solid #294366;
  border-radius: 12px;
  padding: 6px;
  box-shadow: 0 10px 30px #0006;
  z-index: 1000;
}

#attachMenu[hidden] {
  display: none;
}

#attachMenu button {
  display: block;
  width: 100%;
  padding: 12px;
  background: transparent;
  color: white;
  border: none;
  border-radius: 8px;
  text-align: left;
  cursor: pointer;
}

#attachMenu button:hover {
  background: #176BFA;
}

.message-input #user-input {
  flex: 1;
  min-width: 0;
}
  
/* Nafay AI Image Style Selector */
.style-selector-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 12px 0 10px;
  padding: 10px 12px;
  background: #0f1b2d;
  border: 1px solid #294366;
  border-radius: 12px;
}

.style-selector-wrap label {
  color: #B8CCE9;
  font-size: 14px;
  font-weight: 600;
}

#imageStyle {
  flex: 1;
  min-width: 0;
  background: #081426;
  color: #F5F9FF;
  border: 1px solid #294366;
  border-radius: 10px;
  padding: 10px;
  cursor: pointer;
}

#imageStyle:focus {
  outline: 2px solid #176BFA;
}

@media (max-width: 480px) {
  .style-selector-wrap {
    flex-direction: column;
    align-items: stretch;
  }
}

/* Nafay AI - New Chat and History */
.chat-controls {
  display: flex;
  justify-content: center;
  gap: 12px;
  max-width: 768px;
  margin: 15px auto;
  padding: 0 12px;
}

.chat-controls button {
  flex: 1;
  padding: 12px;
  background: #176BFA;
  color: #FFFFFF;
  border: none;
  border-radius: 12px;
  font-weight: 600;
  cursor: pointer;
}

.chat-controls button:hover {
  background: #0952D4;
}

#historyPanel {
  max-width: 768px;
  margin: 10px auto;
  padding: 16px;
  background: #142742;
  border: 1px solid #294366;
  border-radius: 14px;
  color: #FFFFFF;
}

#historyPanel[hidden] {
  display: none !important;
}

#historyList {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 12px;
}

#historyList button {
  width: 100%;
  padding: 12px;
  background: #081426;
  color: #FFFFFF;
  border: 1px solid #294366;
  border-radius: 10px;
  text-align: left;
  cursor: pointer;
}

@media (max-width: 480px) {
  .chat-controls {
    gap: 8px;
  }

  .chat-controls button {
    font-size: 13px;
    padding: 10px;
  }
}
  
/* Nafay AI Professional Branding */
.nafay-brand {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 14px;
}

.nafay-logo {
  width: 56px;
  height: 56px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  border-radius: 16px;
  background: linear-gradient(135deg, #176BFA, #063185);
  color: white;
  font-size: 34px;
  box-shadow: 0 4px 18px rgba(23,107,250,.35);
}

.nafay-brand-text h1 {
  margin: 0;
  color: #176BFA;
  font-size: 28px;
}

.nafay-brand-text p {
  margin: 5px 0 0;
  color: #8BABD8;
  font-size: 13px;
}
 
/* Nafay AI Logo */
.nafay-brand {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 14px;
}

.nafay-logo {
  width: 56px;
  height: 56px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  border-radius: 16px;
  background: linear-gradient(135deg, #176BFA, #063185);
  color: white;
  font-size: 34px;
  box-shadow: 0 4px 18px rgba(23,107,250,0.35);
}

.nafay-brand-text h1 {
  margin: 0;
  color: #176BFA;
  font-size: 28px;
}

.nafay-brand-text p {
  margin: 5px 0 0;
  color: #8BABD8;
  font-size: 13px;
}
  
		</style>
	</head>
	<body>
		<header>
			

<div class="nafay-brand">
  <div class="nafay-logo">✦</div>
  <div class="nafay-brand-text">
    
<div class="nafay-brand">
  <div class="nafay-logo">✦</div>
  <div class="nafay-brand-text">
    <h1>Nafay AI</h1>
    <p>Your Intelligent Assistant</p>
  </div>
</div>

  </div>
</div>

  
			</header>

<div class="chat-controls">
  <button type="button" id="newChatBtn">
    + New Chat
  </button>
  <button type="button" id="historyBtn">
    Chat History
  </button>
</div>

<div id="historyPanel" hidden>
  <h3>Previous Conversations</h3>
  <div id="historyList"></div>
</div>
  
		<div class="chat-container">
			<div id="chat-messages" class="chat-messages">
				<div class="message assistant-message">
					<p>
						Hello I am Nafay Ai
					</p>
				</div>
			</div>

			<div class="typing-indicator" id="typing-indicator">
				AI is thinking...
			</div>

			


<div class="message-input">
  <div class="attach-wrapper">
    <button type="button" id="plusBtn" aria-label="More options">+</button>
    <div id="attachMenu" hidden>
      <button type="button" id="uploadBtn">Upload</button>
      <div class="style-selector-wrap">
  <label for="imageStyle">Image Style</label>
  <select id="imageStyle">
    <option value="auto">Auto</option>
    <option value="realistic">Realistic Photo</option>
    <option value="3d">3D Render</option>
    <option value="cartoon">Cartoon</option>
    <option value="anime">Anime</option>
    <option value="poster">Poster</option>
  </select>
</div><button type="button" id="createImageBtn">Create Image</button>
      <button type="button" id="createVideoBtn">Create Video</button>
    </div>
  </div>

  <textarea
    id="user-input"
    placeholder="Ask Nafay AI..."
    rows="1"
    autofocus
  ></textarea>

  <button id="send-button">Send</button>
</div>

<input id="fileInput" type="file" accept="image/*,video/*" hidden />
  
		</div>

		<footer>
			
<p>Nafay AI • Powered by Cloudflare Workers AI</p>

		</footer>

		<!-- Chat app script -->
		<script src="chat.js"></script>
	

<script>
document.addEventListener("DOMContentLoaded", () => {
  const plus = document.getElementById("plusBtn");
  const menu = document.getElementById("attachMenu");
  const upload = document.getElementById("uploadBtn");
  const imageBtn = document.getElementById("createImageBtn");
  const videoBtn = document.getElementById("createVideoBtn");
  const fileInput = document.getElementById("fileInput");
  const chat = document.getElementById("chat-messages");

  if (!plus || !menu || !chat) {
    console.error("Nafay AI: Required elements missing");
    return;
  }

  // Open or close the Plus menu
  plus.addEventListener("click", (e) => {
    e.stopPropagation();
    menu.hidden = !menu.hidden;
  });

  document.addEventListener("click", (e) => {
    if (!e.target.closest(".attach-wrapper")) {
      menu.hidden = true;
    }
  });

  // Upload files
  upload.addEventListener("click", () => {
    menu.hidden = true;
    fileInput.click();
  });

  
fileInput.addEventListener("change", () => {
  const file = fileInput.files?.[0];
  if (!file) return;

  if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
    alert("Sirf JPG, PNG ya WEBP image upload karein.");
    fileInput.value = "";
    return;
  }

  if (file.size > 3 * 1024 * 1024) {
    alert("Image 3 MB se chhoti honi chahiye.");
    fileInput.value = "";
    return;
  }

  const preview = document.createElement("div");
  preview.className = "message user-message";

  const img = document.createElement("img");
  img.src = URL.createObjectURL(file);
  img.alt = file.name;
  img.style.cssText =
    "max-width:250px;width:100%;border-radius:12px;";

  img.onload = () => URL.revokeObjectURL(img.src);

  preview.appendChild(img);
  chat.appendChild(preview);
  chat.scrollTop = chat.scrollHeight;

  fileInput.value = "";
});

  // Image styles
  const stylePrompts = {
    auto: "",
    realistic:
      "Photorealistic DSLR photograph, natural light, " +
      "realistic textures, no CGI, no cartoon. ",
    "3d":
      "Professional cinematic 3D rendering, detailed " +
      "materials and realistic lighting. ",
    cartoon:
      "Colorful cartoon illustration, expressive design. ",
    anime:
      "Detailed anime illustration, vibrant colors. ",
    poster:
      "Professional creative poster, bold composition. "
  };

  // Create a real image
  imageBtn.addEventListener("click", async () => {
    menu.hidden = true;

    const description = window.prompt(
      "Nafay AI: Kis cheez ki image banani hai?"
    );

    if (!description?.trim()) return;

    const style =
      document.getElementById("imageStyle")?.value || "auto";

    const finalPrompt =
      (stylePrompts[style] || "") + description.trim();

    const box = document.createElement("div");
    box.className = "message assistant-message";

    const status = document.createElement("p");
    status.textContent = "Nafay AI image bana raha hai...";
    box.appendChild(status);
    chat.appendChild(box);

    imageBtn.disabled = true;

    try {
      const response = await fetch("/api/create-image", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          prompt: finalPrompt
        })
      });

      const data = await response.json();

      if (!response.ok || !data.image) {
        throw new Error(
          data.error || "Image generation failed"
        );
      }

      status.textContent = "Generated Image:";

      const img = document.createElement("img");
      img.src = data.image;
      img.alt = description;
      img.style.cssText =
        "max-width:100%;border-radius:12px;margin-top:10px";
      box.appendChild(img);

      const link = document.createElement("a");
      link.href = data.image;
      link.download = "nafay-ai-image.jpg";
      link.textContent = "Download Image";
      link.style.cssText =
        "display:block;color:#76B2FF;margin-top:10px";
      box.appendChild(link);

    } catch (error) {
      status.textContent =
        "Image error: " + error.message;
    } finally {
      imageBtn.disabled = false;
      chat.scrollTop = chat.scrollHeight;
    }
  });

  // Video placeholder
 
videoBtn.addEventListener("click", () => {
  menu.hidden = true;
  window.location.href = "/video.html";
});
  
  });
});
</script>

 
</body>
</html>
