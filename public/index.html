<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Nafay AI | Your Intelligent Assistant</title>
		<style>
			:root {
  --primary-color: #176BFA;
  --primary-hover: #0952D4;
  --light-bg: #081426;
  --border-color: #294366;
  --text-color: #F5F9FF;
  --text-light: #B8CCE9;
  --user-msg-bg: #164FAA;
  --assistant-msg-bg: #142742;
}

			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			body {
				font-family:
					-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
					Cantarell, sans-serif;
				line-height: 1.6;
				color: var(--text-color);
				max-width: 800px;
				margin: 0 auto;
				padding: 1rem;
			}

			header {
				text-align: center;
				margin-bottom: 2rem;
				padding: 1rem 0;
				border-bottom: 1px solid var(--border-color);
			}

			h1 {
				font-size: 1.5rem;
				color: var(--primary-color);
			}

			.chat-container {
				display: flex;
				flex-direction: column;
				height: calc(100vh - 200px);
				min-height: 400px;
				border: 1px solid var(--border-color);
				border-radius: 8px;
				overflow: hidden;
			}

			.chat-messages {
				flex: 1;
				overflow-y: auto;
				padding: 1rem;
				background-color: var(--light-bg);
			}

			.message {
				margin-bottom: 1rem;
				padding: 0.75rem;
				border-radius: 8px;
				max-width: 80%;
			}

			.message p {
				white-space: pre-line;
				margin: 0;
				overflow-wrap: anywhere;
			}

			.user-message {
				background-color: var(--user-msg-bg);
				align-self: flex-end;
				margin-left: auto;
			}

			.assistant-message {
				background-color: var(--assistant-msg-bg);
				align-self: flex-start;
			}

			.message-input {
				display: flex;
				padding: 0.75rem;
				border-top: 1px solid var(--border-color);
				background-color: white;
			}

			#user-input {
				flex: 1;
				padding: 0.75rem;
				border: 1px solid var(--border-color);
				border-radius: 4px;
				font-family: inherit;
				resize: none;
				min-height: 44px;
			}

			#send-button {
				margin-left: 0.5rem;
				padding: 0 1rem;
				background-color: var(--primary-color);
				color: white;
				border: none;
				border-radius: 4px;
				cursor: pointer;
				transition: background-color 0.2s;
			}

			#send-button:hover {
				background-color: var(--primary-hover);
			}

			#send-button:disabled {
				background-color: var(--text-light);
				cursor: not-allowed;
			}

			.typing-indicator {
				display: none;
				font-style: italic;
				color: var(--text-light);
				padding: 1rem;
			}

			.typing-indicator.visible {
				display: block;
			}

			footer {
				margin-top: 1rem;
				text-align: center;
				font-size: 0.85rem;
				color: var(--text-light);
			}
		
/* Nafay AI Plus Menu */
.attach-wrapper {
  position: relative;
  flex-shrink: 0;
}

#plusBtn {
  width: 44px;
  height: 44px;
  background: #176BFA;
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 28px;
  cursor: pointer;
}

#plusBtn:hover {
  background: #0952D4;
}

#attachMenu {
  position: absolute;
  bottom: 54px;
  left: 0;
  width: 190px;
  background: #142742;
  border: 1px solid #294366;
  border-radius: 12px;
  padding: 6px;
  box-shadow: 0 10px 30px #0006;
  z-index: 1000;
}

#attachMenu[hidden] {
  display: none;
}

#attachMenu button {
  display: block;
  width: 100%;
  padding: 12px;
  background: transparent;
  color: white;
  border: none;
  border-radius: 8px;
  text-align: left;
  cursor: pointer;
}

#attachMenu button:hover {
  background: #176BFA;
}

.message-input #user-input {
  flex: 1;
  min-width: 0;
}
  
/* Nafay AI Image Style Selector */
.style-selector-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 12px 0 10px;
  padding: 10px 12px;
  background: #0f1b2d;
  border: 1px solid #294366;
  border-radius: 12px;
}

.style-selector-wrap label {
  color: #B8CCE9;
  font-size: 14px;
  font-weight: 600;
}

#imageStyle {
  flex: 1;
  min-width: 0;
  background: #081426;
  color: #F5F9FF;
  border: 1px solid #294366;
  border-radius: 10px;
  padding: 10px;
  cursor: pointer;
}

#imageStyle:focus {
  outline: 2px solid #176BFA;
}

@media (max-width: 480px) {
  .style-selector-wrap {
    flex-direction: column;
    align-items: stretch;
  }
}
  </style>
	</head>
	<body>
		<header>
			<h1>Cloudflare AI Chat</h1>
			<p>Powered by Cloudflare Workers AI</p>
		</header>

		<div class="chat-container">
			<div id="chat-messages" class="chat-messages">
				<div class="message assistant-message">
					<p>
						Hello! I'm an LLM chat app powered by Cloudflare Workers AI. How can
						I help you today?
					</p>
				</div>
			</div>

			<div class="typing-indicator" id="typing-indicator">
				AI is thinking...
			</div>

			

<div class="style-selector-wrap">
  <label for="imageStyle">Image Style</label>
  <select id="imageStyle">
    <option value="auto">Auto</option>
    <option value="realistic">Realistic Photo</option>
    <option value="3d">3D Render</option>
    <option value="cartoon">Cartoon</option>
    <option value="anime">Anime</option>
    <option value="poster">Poster</option>
  </select>
</div>
<div class="message-input">
  <div class="attach-wrapper">
    <button type="button" id="plusBtn" aria-label="More options">+</button>
    <div id="attachMenu" hidden>
      <button type="button" id="uploadBtn">Upload</button>
      <button type="button" id="createImageBtn">Create Image</button>
      <button type="button" id="createVideoBtn">Create Video</button>
    </div>
  </div>

  <textarea
    id="user-input"
    placeholder="Ask Nafay AI..."
    rows="1"
    autofocus
  ></textarea>

  <button id="send-button">Send</button>
</div>

<input id="fileInput" type="file" accept="image/*,video/*" hidden />
  
		</div>

		<footer>
			<p>Cloudflare Workers AI Chat Template &copy; 2025</p>
		</footer>

		<!-- Chat app script -->
		<script src="chat.js"></script>
	
<script>
document.addEventListener("DOMContentLoaded", () => {
  const plusBtn = document.getElementById("plusBtn");
  const menu = document.getElementById("attachMenu");
  const uploadBtn = document.getElementById("uploadBtn");
  const imageBtn = document.getElementById("createImageBtn");
  const videoBtn = document.getElementById("createVideoBtn");
  const fileInput = document.getElementById("fileInput");
  const textInput = document.getElementById("user-input");

  if (!plusBtn || !menu) return;

  plusBtn.addEventListener("click", (event) => {
    event.stopPropagation();
    menu.hidden = !menu.hidden;
  });

  document.addEventListener("click", (event) => {
    if (!event.target.closest(".attach-wrapper")) {
      menu.hidden = true;
    }
  });

  uploadBtn.addEventListener("click", () => {
    menu.hidden = true;
    fileInput.click();
  });

  fileInput.addEventListener("change", () => {
    const file = fileInput.files[0];
    if (!file) return;
    alert("Selected: " + file.name +
      "\nAI file analysis is not connected yet.");
  });

  

imageBtn.addEventListener("click", async () => {
  menu.hidden = true;

  const description = window.prompt(
    "Nafay AI: Aap kis cheez ki image banana chahte hain?"
  );

  if (!description || !description.trim()) return;

  const chat = document.querySelector(".chat-messages") ||
    document.getElementById("chat-messages") ||
    document.getElementById("messages");

  if (!chat) {
    alert("Chat container nahi mila. HTML ka message container check karein.");
    return;
  }

  const box = document.createElement("div");
  box.className = "message assistant-message";

  const status = document.createElement("p");
  status.textContent = "Nafay AI image bana raha hai...";
  box.appendChild(status);
  chat.appendChild(box);
  chat.scrollTop = chat.scrollHeight;

  imageBtn.disabled = true;

  try {
   
const stylePrompts = {
  auto: "",
  realistic: "Photorealistic DSLR photography, natural lighting, authentic textures, lifelike details, no CGI, no cartoon. ",
  "3d": "High-quality cinematic 3D render, realistic materials, detailed lighting, professional 3D composition. ",
  cartoon: "Colorful cartoon illustration, expressive characters, clean outlines, playful design. ",
  anime: "Beautiful anime illustration, detailed anime art, vibrant colors, cinematic composition. ",
  poster: "Professional creative poster design, bold composition, attractive typography, high visual impact. "
};
   const response = await fetch("/api/create-image", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
      
prompt: (stylePrompts[
  document.getElementById("imageStyle").value
] || "") + description.trim()
  ] || "") + description.trim()
}),
});

const data = await response.json();
      })
    });

    const data = await response.json();

    if (!response.ok || !data.image) {
      throw new Error(
        data.error || "Image generate nahi hui."
      );
    }

    status.textContent = "Aapki generated image:";

    const img = document.createElement("img");
    img.src = data.image;
    img.alt = description;
    img.style.cssText =
      "max-width:100%;border-radius:12px;margin-top:10px;";
    box.appendChild(img);

    const link = document.createElement("a");
    link.href = data.image;
    link.download = "nafay-ai-image.jpg";
    link.textContent = "Download Image";
    link.style.cssText =
      "display:block;color:#76B2FF;margin-top:10px;";
    box.appendChild(link);

  } catch (error) {
    status.textContent =
      "Image error: " + error.message;
  } finally {
    imageBtn.disabled = false;
    chat.scrollTop = chat.scrollHeight;
  }
});
  

  videoBtn.addEventListener("click", () => {
    menu.hidden = true;
    textInput.placeholder =
      "Describe the video you want to create...";
    textInput.focus();
    alert("Video generation is not connected yet.");
  });
});
</script>
  </body>
</html>
