
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1">
<title>Nafay AI Video Generator</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 padding:20px;
 background:#071426;
 color:white;
 font-family:Arial,sans-serif;
}
main{max-width:750px;margin:auto}
h1{color:#82b6ff}
a{color:#9bc5ff}
.card{
 background:#142742;
 border:1px solid #345579;
 border-radius:18px;
 padding:20px;
 margin:20px 0;
}
label{display:block;margin:15px 0 8px}
textarea,input{
 width:100%;
 background:#081426;
 color:white;
 border:1px solid #42618a;
 border-radius:10px;
 padding:13px;
 font:inherit;
}
textarea{min-height:130px}
button{
 width:100%;
 background:#176bfa;
 color:white;
 padding:15px;
 border:0;
 border-radius:12px;
 margin-top:18px;
 font-weight:bold;
 cursor:pointer;
}
button:disabled{opacity:.5}
video{
 width:100%;
 background:black;
 border-radius:12px;
 display:none;
}
#download{display:none;margin-top:15px}
#status{color:#b7cffa;line-height:1.5}
</style>
</head>
<body>
<main>
<a href="/">← Back to Nafay AI</a>
<h1>✦ Nafay AI Video Studio</h1>
<p>Real AI Text-to-Video Generator</p>

<div class="card">
<label>Describe your video</label>
<textarea id="prompt"
 placeholder="A realistic robot dancing on stage, moving its arms and legs naturally. Fixed camera, no zoom."></textarea>

<label>Your Private Video Access Code</label>
<input id="accessCode"
 type="password"
 placeholder="Enter your private access code"
 autocomplete="off">

<button id="generate">Generate AI Video</button>
<p id="status">Video generation is not enabled yet.</p>
</div>

<div class="card">
<h3>Your AI Video</h3>
<video id="player" controls playsinline></video>
<a id="download" download="Nafay-AI-Video.mp4">
Download Video
</a>
</div>

<script>
const button=document.getElementById("generate");
const statusBox=document.getElementById("status");
const promptBox=document.getElementById("prompt");
const accessBox=document.getElementById("accessCode");
const player=document.getElementById("player");
const download=document.getElementById("download");

let videoURL=null;

const sleep=ms=>
 new Promise(resolve=>setTimeout(resolve,ms));

async function showVideo(response){
 const blob=await response.blob();

 if(!blob.size){
  throw new Error("Empty video file.");
 }

 if(videoURL)URL.revokeObjectURL(videoURL);
 videoURL=URL.createObjectURL(blob);

 player.src=videoURL;
 player.style.display="block";
 download.href=videoURL;
 download.style.display="inline-block";
 statusBox.textContent="Your AI video is ready!";
}

async function checkResult(id,code){
 for(let i=0;i<60;i++){
  await sleep(5000);

  const response=await fetch(
   "/api/video-result?id="+encodeURIComponent(id),
   {headers:{"X-Video-Code":code}}
  );

  if(response.ok){
   const type=response.headers.get("content-type")||"";

   if(type.startsWith("video/")){
    await showVideo(response);
    return;
   }
  }

  if(response.status!==202 &&
     response.status!==409 &&
     response.status!==404){
   throw new Error("Video processing failed.");
  }

  statusBox.textContent=
   "AI is processing your video... "+(i+1);
 }

 throw new Error(
  "Video is taking too long. Check its job status."
 );
}

button.addEventListener("click",async()=>{
 const prompt=promptBox.value.trim();
 const code=accessBox.value.trim();

 if(!prompt){
  alert("Please write a video prompt.");
  return;
 }

 if(!code){
  alert("Enter your private access code.");
  return;
 }

 button.disabled=true;
 player.style.display="none";
 download.style.display="none";
 statusBox.textContent="Connecting to AI video service...";

 try{
  const response=await fetch("/api/create-video",{
   method:"POST",
   headers:{
    "Content-Type":"application/json",
    "X-Video-Code":code
   },
   body:JSON.stringify({prompt})
  });

  const type=response.headers.get("content-type")||"";

  if(response.ok && type.startsWith("video/")){
   await showVideo(response);
   return;
  }

  const data=await response.json();

  if(!response.ok){
   throw new Error(
    data.error||"Video generation unavailable."
   );
  }

  if(data.status==="processing" && data.jobId){
   statusBox.textContent="AI video job started...";
   await checkResult(data.jobId,code);
   return;
  }

  throw new Error("Unexpected API response.");

 }catch(error){
  statusBox.textContent="Error: "+error.message;
 }finally{
  button.disabled=false;
 }
});
</script>
</main>
</body>
</html>
